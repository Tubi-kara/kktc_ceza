name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kktc_ceza_app.apk

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKTC_Trafik_Ceza_Radar_APK
          path: kktc_ceza_app.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "KKTC Trafik & Ceza Radar (En Güncel Sürüm)"
          body: |
            ## 🚀 KKTC Trafik Ceza Radar - En Son Güncelleme
            Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiştir.
            
            ### 📲 İndirme ve Kurulum
            Aşağıdaki `kktc_ceza_app.apk` dosyasına dokunarak telefonunuza kablosuz kurabilirsiniz.
          files: kktc_ceza_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
