<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/kktc_ceza/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KKTC e-Trafik: Ceza Sorgulama, Radar Uyarıları, Seyrüsefer ve Akıllı Navigasyon Portalı">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060B19">

  <!-- iOS meta tags & icons (Ana Ekrana Ekle -> tam ekran uygulama) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KKTC Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KKTC e-Trafik</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #060B19; }
    #kktc-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #0E2A2A 0%, #060B19 70%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #E2E8F0; transition: opacity .4s ease;
    }
    #kktc-splash img { width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 0 40px rgba(16,185,129,.45); }
    #kktc-splash .bar { width: 120px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.1); overflow: hidden; }
    #kktc-splash .bar::after { content: ''; display: block; width: 40%; height: 100%;
      background: #10B981; animation: kktc-load 1.1s ease-in-out infinite; }
    @keyframes kktc-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="kktc-splash">
    <img src="icons/Icon-192.png" alt="KKTC Radar">
    <div style="font-weight:800;letter-spacing:.5px">KKTC <span style="color:#10B981">RADAR</span></div>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter ilk kareyi çizince açılış ekranını kaldır
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('kktc-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
